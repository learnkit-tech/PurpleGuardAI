[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "purpleguard-ai"
version = "0.1.0"
description = "Autonomous security scanner for Python codebases: attack validation, conservative remediation, and adversarial re-testing."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "LearnKit Tech" }]
dependencies = [
    "flask>=3.0",
    "markupsafe>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
purpleguard = "purpleguard_cli:main"

[tool.setuptools]
py-modules = ["main", "purpleguard_cli"]

[tool.setuptools.packages.find]
include = ["scanner*", "hacker*"]
